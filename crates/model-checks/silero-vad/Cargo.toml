[package]
name = "burn-onnx-model-checks-silero-vad"
version = "0.1.0"
edition = "2024"
publish = false


[features]
default = ["flex"]
flex = ["burn/flex"]
tch = ["burn/tch"]
wgpu = ["burn/wgpu", "burn/autotune", "burn/fusion"]
metal = ["burn/metal", "burn/autotune", "burn/fusion"]

[dependencies]
burn = { workspace = true }
burn-store = { workspace = true, features = ["std"] }
model-checks-common = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
burn-onnx = { workspace = true, features = ["default"] }
model-checks-common = { workspace = true }
