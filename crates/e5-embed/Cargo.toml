[package]
name = "e5-embed"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["flex"]
flex = ["burn/flex", "burn/store"]
cpu = ["burn/cpu", "burn/store"]

[dependencies]
burn = { workspace = true }
burn-store = { workspace = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentencepiece-rs = "0.2"
memory-stats = "1"

[build-dependencies]
burn-onnx = { workspace = true, features = ["default"] }
