[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Stage 4 i8 GEMM stack. TsaoLun/{cubek,burn,burn-onnx,cubecl} denied this
# agent's push (403), so each fork's working tree is published as an orphan
# snapshot on this repo (`vendor/*`). After you push the real fork branches,
# point these `rev`s at those commits and drop the vendor branches.
#
# | snapshot | branch |
# |---|---|
# | burn / burn-store | `vendor/burn-flash-512` |
# | burn-onnx / onnx-ir | `vendor/burn-onnx-coalesce-int8-attn` |
# | cubek | `vendor/cubek-add-i8-gemm` |
# | cubecl (host TM) | `vendor/cubecl-host-native-jit` |
burn = { git = "https://github.com/TsaoLun/burn-e5q", default-features = false, rev = "245ab354c8109e74f7c2d80008130532dc3fe708" }
burn-store = { git = "https://github.com/TsaoLun/burn-e5q", default-features = false, rev = "245ab354c8109e74f7c2d80008130532dc3fe708", features = ["std"] }

burn-onnx = { git = "https://github.com/TsaoLun/burn-e5q", default-features = false, rev = "f78e156bd46dde41f822c77f3209290157c5a9b4" }
onnx-ir = { git = "https://github.com/TsaoLun/burn-e5q", default-features = false, rev = "f78e156bd46dde41f822c77f3209290157c5a9b4" }

cubek = { git = "https://github.com/TsaoLun/burn-e5q", default-features = false, rev = "29485715f433fd26863dcaa5c8cc80f2a98f6183" }

# burn/cpu still depends on `git = "https://github.com/tracel-ai/cubek"`.
[patch."https://github.com/tracel-ai/cubek"]
cubek = { git = "https://github.com/TsaoLun/burn-e5q", rev = "29485715f433fd26863dcaa5c8cc80f2a98f6183" }

# Local overlay for a sibling cubek checkout (uncomment while iterating on kernels;
# comment out the git patch block above — Cargo allows only one patch table per source):
# [patch."https://github.com/tracel-ai/cubek"]
# cubek = { path = "../cubek/crates/cubek" }
